name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_arm64:
        description: Run native ARM tests (requires an available macOS ARM runner)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-tests-and-build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.native_arm64 && 'macos-15' || 'macos-15-intel' }}
    env:
      DUEBRIDGE_TEST_ARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.native_arm64 && 'arm64' || 'x86_64' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check native architecture and tools
        run: |
          test "$(uname -m)" = "$DUEBRIDGE_TEST_ARCH"
          xcode-select -p
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-path
          node --version
          python3 --version
      - name: Synthetic tests (including authentication challenges)
        run: ./scripts/test.sh all
      - name: Build local app without launching
        run: ./scripts/build-app.sh
      - name: Verify Apple Silicon application architecture
        run: test "$(/usr/bin/lipo -archs build/DueBridge.app/Contents/MacOS/DueBridge)" = arm64
  windows-tests-and-build:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: ga
      - name: Test BB parsing and shared deadline rules
        run: dotnet run --configuration Release --project Windows/DueBridge.Core.Tests
      - name: Test school adapters without accounts
        run: |
          dotnet run --configuration Release --project Windows/DueBridge.School.Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test Windows/DueBridge.School.Tests/SchoolBridge.test.cjs
      - name: Test desktop snapshots, Windows DPAPI and Outlook retry recovery
        run: dotnet run --configuration Release --project Windows/DueBridge.Outlook.Tests
      - name: Build self-contained Windows x64 app
        run: dotnet publish Windows/DueBridge.Windows --configuration Release --runtime win-x64 --self-contained true --output build/windows
      - name: Verify Windows executable architecture
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("build/windows/DueBridge.exe")
          $offset = [BitConverter]::ToInt32($bytes, 60)
          if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or
              [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) {
              throw "Expected an x64 PE executable."
          }
